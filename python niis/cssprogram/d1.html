<!DOCTYPE html>
<html>
<head>
<style>

/* Descendant selector */
div p {
  color: blue;
}

</style>
</head>

<body>

<div>
  <p>This is inside div (will be blue)</p>

  <section>
    <p>This is also inside div (will be blue)</p>
  </section>
</div>

<p>This is outside div (will NOT be blue)</p>

</body>
</html>
