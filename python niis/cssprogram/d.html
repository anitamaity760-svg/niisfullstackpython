<!DOCTYPE html>
<html>
<head>
<style>

/* Child selector */
div > p {
  color: red;
  font-weight: bold;
}

</style>
</head>

<body>

<div>
  <p>This is a direct child paragraph (will be red)</p>

  <section>
    <p>This is NOT a direct child (will NOT be red)</p>
  </section>
</div>

</body>
</html>
