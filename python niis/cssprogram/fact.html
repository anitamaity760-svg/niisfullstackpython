<!DOCTYPE html>
<html>
<body>

<h3>Factorial</h3>

<input type="number" id="num">
<button onclick="factorial()">Find</button>

<p id="res"></p>

<script>
function factorial() {
    let n = Number(document.getElementById("num").value);
    let fact = 1;

    for (let i = 1; i <= n; i++) {
        fact *= i;
    }

    document.getElementById("res").innerHTML = "Factorial = " + fact;
}
</script>

</body>
</html>
