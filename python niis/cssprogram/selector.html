<!DOCTYPE html>
<html>
<head>
<style>

/* 1. Universal selector */
* {
  font-family: Arial;
}

/* 2. Element selector */
h1 {
  color: blue;
}

/* 3. ID selector */
#header {
  background-color: lightgray;
  padding: 10px;
}

/* 4. Class selector */
.box {
  border: 2px solid black;
  padding: 10px;
}

/* 5. Group selector */
h2, p {
  color: green;
}

</style>
</head>

<body>

<div id="header">
  <h1>Main Heading</h1>
</div>

<div class="box">
  <h2>Sub Heading</h2>
  <p>This is a paragraph inside the box.</p>
</div>

</body>
</html>
