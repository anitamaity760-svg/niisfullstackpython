<html>
<body>

<center><b>My Multi Level Table</b></center><br>

<table border="1" width="60%" align="center">

    <!-- Header Row 1 -->
    <tr>
        <th rowspan="2">Column 0</th>
        <th rowspan="2">Column 1</th>
        <th colspan="2">Column 2</th>
    </tr>

    <!-- Header Row 2 -->
    <tr>
        <th>Column 2a</th>
        <th>Column 2b</th>
    </tr>

    <!-- Row 1 -->
    <tr>
        <td rowspan="2">Row1</td>
        <td>Row 1a</td>
        <td align="center">123</td>
        <td align="center">456</td>
        <td align="center">789</td>
    </tr>

    <tr>
        <td>Row 1b</td>
        <td align="center">123</td>
        <td align="center">456</td>
        <td align="center">789</td>
    </tr>

    <!-- Row 2 -->
    <tr>
        <td colspan="2">Row 2</td>
        <td align="center">123</td>
        <td align="center">456</td>
        <td align="center">789</td>
    </tr>

</table>

</body>
</html>
