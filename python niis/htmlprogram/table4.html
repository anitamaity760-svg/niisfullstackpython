<html>
<head>
    <title>Multi Level Table</title>
</head>
<body>

<h2 align="center">My Multi Level Table</h2>

<table border="1" cellspacing="0" cellpadding="8" align="center">
    
    <!-- Header Row -->
    <tr>
        <th rowspan="2">Column 0</th>
        <th rowspan="2">Column 1</th>
        <th colspan="2">Column 2</th>
    </tr>

    <!-- Sub Header -->
    <tr>
        <th>Column 2a</th>
        <th>Column 2b</th>
    </tr>

    <!-- Row 1 -->
    <tr>
        <td rowspan="2">Row1</td>
        <td>Row 1a</td>
        <td>123</td>
        <td>456</td>
        <td>789</td>
    </tr>

    <tr>
        <td>Row 1b</td>
        <td>123</td>
        <td>456</td>
        <td>789</td>
    </tr>

    <!-- Row 2 -->
    <tr>
        <td colspan="2">Row 2</td>
        <td>123</td>
        <td>456</td>
        <td>789</td>
    </tr>

</table>

</body>
</html>
